name: Build and Deploy

on:
    push:
        branches:
            - main

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Install Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.161.1"
                  extended: true

            - name: Build
              run: hugo --minify

            - name: Configure AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Install SSM plugin
              run: |
                  curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
                    -o session-manager-plugin.deb
                  sudo dpkg -i session-manager-plugin.deb

            - name: Copy site files via SSM
              run: |
                  # Sync files to S3
                  aws s3 sync public/ s3://andrewflanigan-terraform-state/site-deploy/ --delete

                  # Pull from S3 on the instance and wait for completion
                  COMMAND_ID=$(aws ssm send-command \
                      --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
                      --document-name "AWS-RunShellScript" \
                      --parameters "{\"commands\":[
                      \"aws s3 sync s3://andrewflanigan-terraform-state/site-deploy/ /var/www/andrewflanigan.com/ --delete\",
                      \"aws s3 rm s3://andrewflanigan-terraform-state/site-deploy/ --recursive\"
                      ]}" \
                      --query "Command.CommandId" \
                      --output text)

                  echo "Waiting for sync command $COMMAND_ID to complete..."

                  aws ssm wait command-executed \
                      --command-id "$COMMAND_ID" \
                      --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

                  # Print output for debugging
                  aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                      --query "[StandardOutputContent, StandardErrorContent]" \
                      --output text
