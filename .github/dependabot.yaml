version: 2

updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
    assignees:
      - "AndrewFlan"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
