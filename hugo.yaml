  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: Website DevOps Project
        content: Creating a Personal Website to learn AWS and DevOps Principals such as CI/CD, IaC, etc.
        image: /images/projects/profile2.jpg

        featured:
          name: Demo
          link: https://andrewflanigan.com
        badges:
          - "AWS"
          - "Terraform"
          - "Ansible"
          - "CI/CD"
        links:
          - icon: fab fa-github
            url: https://github.com/gurusabarish/hugo-profile

