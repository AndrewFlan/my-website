params:
  title: "Andrew Flanigan"
  description: Resume Site for Andrew Flanigan
  # staticPath: ""  # The path to serve the static files from
  # favicon: "/fav.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  # color:
  #   textColor: "#343a40"
  #   secondaryTextColor: "#6c757d"
  #   textLinkColor: "#007bff"
  #   backgroundColor: "#eaedf0"
  #   secondaryBackgroundColor: "#64ffda1a"
  #   primaryColor: "#007bff"
  #   secondaryColor: "#f8f9fa"

  #   darkmode:
  #     textColor: "#e4e6eb"
  #     secondaryTextColor: "#b0b3b8"
  #     textLinkColor: "#ffffff"
  #     backgroundColor: "#18191a"
  #     secondaryBackgroundColor: "#212529"
  #     primaryColor: "#ffffff"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    # brandName: "Hugo Profile" # Brand name for the brand | default is the title variable
    disableSearch: true
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: true
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Andrew."
    subtitle: "I am a SRE with 9+ years of experience"
    content: "I enjoy solving infrastructure problems, improving reliability, and working closely with development teams to keep things running smoothly."
    image: /images/headshot.jpg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Resume"
      url: "/files/Site_Andrew_Flanigan_Resume.pdf"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/AndrewFlan
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/andrew-flanigan/

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/man.png"
    content: |-
      Site Reliability Engineer with experience spanning systems administration, Kubernetes, cloud infrastructure, monitoring, and observability. 

      I've spent most of my career working across the full infrastructure stack, from server administration to managing large-scale Kubernetes environments and cloud migrations.
    skills:
      enable: true
      title: "Here are a few of my skills:"
      items:
        - "Kubernetes"
        - "AWS"
        - "IaC"
        - "CI/CD"
        - "Terraform"
        - "Ansible"
        - "Python"
        - "Ruby on Rails"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - company: "Oracle"
        companyUrl: "https://www.oracle.com/"
        jobs:
          - name: "Senior Site Reliability Engineer"
            date: "Aug 2024 - March 2026"
            content: |
              - Contributed to and helped drive Kubernetes migration efforts from AWS to OCI, including cluster provisioning, configuration, management and observability.
              - Managed Kubernetes cluster lifecycle across Dev, Non-Prod, and Production environments, overseeing clusters ranging from small-scale to 250+ worker nodes, ensuring clusters remained current, stable, and compliant with Oracle security standards.
              - Utilized Terraform to deploy, configure, and maintain cloud infrastructure including Kubernetes clusters, MySQL instances, and Redis instances on OCI.
              - Maintained and debugged Spinnaker CI/CD pipelines, resolving pipeline failures and updating configurations to support application deployments across Kubernetes clusters.
              - Served as the primary point of contact for internal development teams, providing troubleshooting assistance and owning the end-to-end change management and deployment process for application releases.
          - name: "Site Reliability Engineer II"
            date: "Oct 2022 - Aug 2024"
            content: |
              - Developed and maintained Python automation pipelines for onboarding tasks and multi-product deployments.
              - Built and maintained a Ruby on Rails application enabling end-users to auto-generate Jira tickets, reducing manual overhead.
              - Managed operations, deployments, and monitoring for multiple products running on AWS EKS clusters.
              - Wrote Python scripts to extract and process data from MySQL databases for operational reporting.
              - Developed and maintained Power BI dashboards to visualize project tracking metrics.

      - company: "Cerner Corporation"
        companyUrl: "https://www.oracle.com/corporate/acquisitions/cerner/"
        jobs:
          - name: "Site Reliability Engineer"
            date: "May 2022 - Oct 2022"
            content: |
              - Built, managed, and maintained multiple Kubernetes clusters on Oracle Linux VMs.
              - Configured application-level monitoring and alerting with New Relic and Splunk across Kubernetes environments.
              - Contributed new features and UI improvements to an internal automation tool within the React framework.
          - name: "System Engineer II"
            date: "Oct 2019 - May 2022"
            content: |
              - Delivered ongoing system implementation, support, monitoring, and maintenance of Cerner's Remote Hosted solutions and infrastructure for hospital systems.
              - Served as the Subject Matter Expert for IBM WebSphere, providing Tier 3 on-call support for WebSphere enterprise applications across Cerner's client base.
              - Developed PowerShell scripts to automate log collection and centralization, streamlining the troubleshooting process for the team.
              - Created documentation and training materials for a new cloud-based application support model, enabling client teams to manage environments more independently and reduce troubleshooting resolution time.
          - name: "System Engineer"
            date: "Jul 2017 - Oct 2019"
            content: |
              - Provided system implementation, support, monitoring, and maintenance of Cerner’s Remote Hosted solutions, services, and infrastructure for hospital systems.
              - Led client adoption, planning, and change management for major Cerner EHR Platform upgrades, ensuring smooth transitions across hospital system environments.
              - Carried out code deployments, tech stack upgrades, infrastructure refreshes, and assisted in piloting new technologies and processes.
              - Administered RHEL/Oracle Linux and Windows Server 2008/2012/2016/2019 environments as well as integrating third-party solutions including IBM Websphere, Citrix XenApp, SQL Server, SAP Business Objects and Kofax Document Imaging.
              - Developed deep expertise across multiple solutions, serving as the team's primary resource for troubleshooting and technical assistance.

  # Education
  education:
    enable: true
    # title: "Custom Name"
    index: false
    items:
      - title: "Bachelor of Science in Information Technology"
        school:
          name: "Georgia Southern University"
          url: "https://www.georgiasouthern.edu/"
        date: "2013 - 2017"
        GPA: "3.5 out of 4.0"
        content: |-
          Major: Information Technology

          Minor: Computer Science

  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: Website DevOps Project
        content: Creating a Personal Website to learn AWS and DevOps Principals such as CI/CD, IaC, etc.
        image: /images/projects/profile2.jpg

        featured:
          name: About
          link: /website-project
        badges:
          - DevOps
          - AWS
          - IaC
          - CI/CD
          - Terraform
          - Ansible
          - Github Actions
          - Automation
        links:
          - icon: fab fa-github
            url: https://github.com/AndrewFlan

  #Contact
  contact:
    enable: true
    # title: "Custom Name"
    content: You can reach out to me via Linkedin, I’ll try my best to get back to you!
    btnName: Linkedin
    btnLink: https://www.linkedin.com/in/andrew-flanigan/

  footer:
    socialNetworks:
      github: https://github.com/AndrewFlan
      linkedin: https://www.linkedin.com/in/andrew-flanigan/

  # List pages like blogs and posts
  listPages:
    disableFeaturedImage: false

  # Single pages like blog and post
  singlePages:
    socialShare: false
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  # For translations
  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"

  #customScripts: -| # You can add custom scripts which will be added before </body> tag
  #  <script type="text/javascript"><!-- any script here --></script>
